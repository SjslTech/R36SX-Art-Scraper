<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R36SX Art Scraper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0d0d0d; --card: #161616; --accent: #00cf8d; --text: #efefef; --dim: #666; --warn: #ff4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }
        .container {
            background: var(--card); padding: 2rem; border-radius: 12px;
            border: 1px solid #222; width: 100%; max-width: 500px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 3px; font-size: 1.1rem; margin-top: 0; }
        
        .controls { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; }
        
        .type-selector {
            display: flex; justify-content: space-around; background: #111; 
            padding: 15px; border-radius: 8px; border: 1px solid #333; gap: 15px;
        }
        .type-option { cursor: pointer; opacity: 0.35; transition: 0.3s; flex: 1; }
        
        .img-container {
            width: 100%; height: 110px; display: flex; align-items: center;
            justify-content: center; background: #000; border-radius: 4px;
            border: 2px solid transparent; overflow: hidden;
        }
        .type-option img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .type-option.active { opacity: 1; }
        .type-option.active .img-container { border-color: var(--accent); }
        .type-label { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-top: 8px; color: var(--text); }

        select, .btn {
            padding: 14px; border-radius: 6px; border: 1px solid #333;
            background: #111; color: white; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.9rem;
        }
        .btn { background: var(--accent); color: #000; border: none; transition: 0.2s; margin-top: 10px; }
        .btn:hover { filter: brightness(1.2); }
        .btn#stop { background: var(--warn); display: none; margin-top: 5px; }
        .btn:disabled { opacity: 0.2; cursor: wait; }

        #log {
            margin-top: 20px; font-family: 'Consolas', monospace; font-size: 0.7rem;
            color: #aaa; height: 160px; overflow-y: auto; text-align: left;
            background: #000; padding: 12px; border-radius: 4px; border: 1px solid #222;
        }
        .progress-bar { height: 4px; background: #222; margin-top: 15px; border-radius: 2px; overflow: hidden; }
        #progress { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }
        .status-text { font-size: 0.75rem; color: var(--dim); margin-top: 10px; }
        
        /* New styling for the metrics row */
        .metrics-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--dim);
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>R36SX Art Scraper</h1>
    
    <div class="controls">
        <label style="font-size: 0.8rem; text-align: left; color: var(--dim);">Target System:</label>
        <select id="sys">
            <option value="Atari_-_2600">ATARI 2600</option>
            <option value="Atari_-_7800">ATARI 7800</option>
            <option value="Nintendo_-_Nintendo_Entertainment_System">FC (NES)</option>
            <option value="Nintendo_-_Game_Boy">GB (Game Boy)</option>
            <option value="Nintendo_-_Game_Boy_Advance">GBA (Game Boy Advance)</option>
            <option value="Nintendo_-_Game_Boy_Color">GBC (Game Boy Color)</option>
            <option value="Sega_-_Game_Gear">GG (Game Gear)</option>
            <option value="MAME">MAME (Arcade)</option>
            <option value="Sega_-_Mega_Drive_-_Genesis">MD (Mega Drive / Genesis)</option>
            <option value="SNK_-_Neo_Geo_Pocket_Color">NGPC (Neo Geo Pocket Color)</option>
            <option value="NEC_-_PC_Engine_-_TurboGrafx_16">PCE (PC Engine / TurboGrafx)</option>
            <option value="Sony_-_PlayStation">PS (PlayStation)</option>
            <option value="Nintendo_-_Super_Nintendo_Entertainment_System">SFC (Super Famicom / SNES)</option>
        </select>

        <div class="type-selector">
            <div class="type-option active" id="opt-boxart" onclick="setType('Named_Boxarts')">
                <div class="img-container"><img src="Boxart.png" alt="Boxart"></div>
                <div class="type-label">Box Art</div>
            </div>
            <div class="type-option" id="opt-snaps" onclick="setType('Named_Snaps')">
                <div class="img-container"><img src="Snaps.png" alt="Snap"></div>
                <div class="type-label">Snapshots</div>
            </div>
        </div>

        <button class="btn" id="go">SELECT ROM FOLDER & START</button>
        <button class="btn" id="stop">STOP & DOWNLOAD</button>
    </div>

    <div class="progress-bar"><div id="progress"></div></div>
    
    <div class="metrics-row">
        <span id="rom-count">0 / 0 ROMs</span>
        <span id="timer">Time: 0s</span>
    </div>

    <div id="log">Ready...</div>
    <div class="status-text" id="stats" style="display:none;">0 ROMs detected</div>
</div>

<script>
    let currentType = 'Named_Boxarts';
    let isRunning = false;
    let timerInterval;

    function setType(type) {
        if (isRunning) return;
        currentType = type;
        document.getElementById('opt-boxart').classList.toggle('active', type === 'Named_Boxarts');
        document.getElementById('opt-snaps').classList.toggle('active', type === 'Named_Snaps');
    }

    const log = (msg, color) => {
        const span = document.createElement('div');
        if(color) span.style.color = color;
        span.innerHTML = msg;
        const logBox = document.getElementById('log');
        logBox.appendChild(span);
        logBox.scrollTop = logBox.scrollHeight;
    };

    const cleanForSaving = (name) => name.replace(/[*/:`<>?\\|"]/g, '_');
    const cleanForSearch = (name) => name.replace(/[&*/:`<>?\\|"]/g, '_');
    const wait = (ms) => new Promise(res => setTimeout(res, ms));

    document.getElementById('stop').onclick = () => { isRunning = false; };

    document.getElementById('go').onclick = async function() {
        try {
            const dirHandle = await window.showDirectoryPicker();
            const system = document.getElementById('sys').value;
            const goBtn = this;
            const stopBtn = document.getElementById('stop');
            const zip = new JSZip();
            const folder = zip.folder("images");
            
            // Start Timer
            let startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                document.getElementById('timer').innerText = `Time: ${mins > 0 ? mins + 'm ' : ''}${secs}s`;
            }, 1000);

            isRunning = true;
            goBtn.disabled = true;
            stopBtn.style.display = "block";
            document.getElementById('log').innerHTML = "";
            log(`--- Initializing Scraper ---`);

            const allowedExtensions = /\.(a26|a78|bin|nes|fds|gb|gba|gbc|gg|sms|fba|md|gen|smd|ngp|ngc|pce|img|iso|cue|pbp|chd|sfc|smc|zip|7z)$/i;

            let roms = [];
            let existingImages = new Set();

            try {
                const imgSubDir = await dirHandle.getDirectoryHandle('images', { create: false });
                for await (const entry of imgSubDir.values()) {
                    if (entry.kind === 'file') existingImages.add(entry.name.toLowerCase());
                }
                log(`Checked 'images' folder: ${existingImages.size} existing files found.`, "#aaa");
            } catch (e) {
                log(`No existing 'images' folder found. Starting fresh.`, "#aaa");
            }

            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && allowedExtensions.test(entry.name)) {
                    roms.push(entry.name);
                }
            }

            document.getElementById('rom-count').innerText = `0 / ${roms.length} ROMs`;
            let foundCount = 0;
            let missedFiles = [];
            let skippedCount = 0;

            for (let i = 0; i < roms.length; i++) {
                if (!isRunning) {
                    log("<br>Stopping process by user request...", "orange");
                    break;
                }

                const rawFileName = roms[i];
                const rawNameOnly = rawFileName.split('.').slice(0, -1).join('.');
                const saveName = cleanForSaving(rawNameOnly);
                const searchName = cleanForSearch(rawNameOnly);

                if (existingImages.has(`${saveName}.png`.toLowerCase())) {
                    log(`Skipping: ${rawNameOnly} (Already exists)`);
                    skippedCount++;
                    document.getElementById('progress').style.width = ((i+1)/roms.length*100) + "%";
                    document.getElementById('rom-count').innerText = `${i + 1} / ${roms.length} ROMs`;
                    continue;
                }

                const url = `https://raw.githubusercontent.com/libretro-thumbnails/${system}/master/${currentType}/${encodeURIComponent(searchName)}.png`;

                log(`Searching: ${rawNameOnly}...`);
                await wait(250 + Math.random() * 200);

                try {
                    const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
                    if (res.ok) {
                        const blob = await res.blob();
                        folder.file(`${saveName}.png`, blob);
                        log(`>> SUCCESS`, "#00cf8d");
                        foundCount++;
                    } else {
                        log(`>> NOT FOUND`, "#ff4444");
                        missedFiles.push(rawFileName);
                    }
                } catch (e) {
                    log(`>> FAIL/TIMEOUT`, "#ff4444");
                    missedFiles.push(rawFileName);
                }
                document.getElementById('progress').style.width = ((i+1)/roms.length*100) + "%";
                document.getElementById('rom-count').innerText = `${i + 1} / ${roms.length} ROMs`;
            }

            if (foundCount > 0) {
                log(`<br>Packaging ${foundCount} new images into ZIP...`, "#fff");
                const content = await zip.generateAsync({type:"blob"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = `${system}_Art.zip`;
                a.click();
            }

            log("<br>--- PROCESS FINISHED ---", "#00cf8d");
            log(`Found: ${foundCount} | Skipped: ${skippedCount}`, "#00cf8d");
            
            if (missedFiles.length > 0) {
                log(`<br><b style="color:#ff4444">Missing Images (${missedFiles.length}):</b>`);
                missedFiles.forEach(file => log(file, "#aaa"));
            }

        } catch (e) {
            log("Error: " + e.message, "#ff4444");
        } finally {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('go').disabled = false;
            document.getElementById('stop').style.display = "none";
        }
    };
</script>
</body>
</html>
